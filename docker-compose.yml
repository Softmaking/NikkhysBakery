name: nikkhysbakery

services:
  postgres:
    image: postgres:16-alpine
    container_name: nikkhysbakery-postgres
    restart: unless-stopped
    env_file:
      - ${SERVER_ROOT:-.}/secrets/nikkhysbakery/backend.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nikkhysbakery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nikkhysbakery}
    volumes:
      - nikkhysbakery-postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nikkhysbakery-network

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: nikkhysbakery-backend
    restart: unless-stopped
    env_file:
      - ${SERVER_ROOT:-.}/secrets/nikkhysbakery/backend.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-nikkhysbakery}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nikkhysbakery-network

  backend-migrate:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
      target: builder
    env_file:
      - ${SERVER_ROOT:-.}/secrets/nikkhysbakery/backend.env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-nikkhysbakery}
    command: ["npm", "run", "migration:run"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nikkhysbakery-network
    restart: "no"

  backend-seed:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
      target: builder
    env_file:
      - ${SERVER_ROOT:-.}/secrets/nikkhysbakery/backend.env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-nikkhysbakery}
    command: ["npm", "run", "seed"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nikkhysbakery-network
    restart: "no"

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend/Dockerfile
    container_name: nikkhysbakery-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nikkhysbakery-network

volumes:
  nikkhysbakery-postgres-data:

networks:
  nikkhysbakery-network:
    driver: bridge
