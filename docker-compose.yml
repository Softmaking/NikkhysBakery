name: nikkhysbakery

services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: nikkhysbakery-backend
    restart: unless-stopped
    env_file:
      - ${SERVER_ROOT:?SERVER_ROOT is required}/secrets/nikkhysbakery/backend.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: ${DB_HOST:-kyrae-postgres}
      DB_PORT: 5432
      DB_NAME: nikkhysbakery
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4201}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nikkhysbakery-network

  backend-migrate:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
      target: builder
    env_file:
      - ${SERVER_ROOT:?SERVER_ROOT is required}/secrets/nikkhysbakery/backend.env
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST:-kyrae-postgres}
      DB_PORT: 5432
      DB_NAME: nikkhysbakery
    command: ["npm", "run", "migration:run"]
    networks:
      - nikkhysbakery-network
    restart: "no"

  backend-seed:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
      target: builder
    env_file:
      - ${SERVER_ROOT:?SERVER_ROOT is required}/secrets/nikkhysbakery/backend.env
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST:-kyrae-postgres}
      DB_PORT: 5432
      DB_NAME: nikkhysbakery
    command: ["npm", "run", "seed"]
    networks:
      - nikkhysbakery-network
    restart: "no"

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend/Dockerfile
    container_name: nikkhysbakery-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4201}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nikkhysbakery-network

networks:
  nikkhysbakery-network:
    external: true
    name: kyrae-network
